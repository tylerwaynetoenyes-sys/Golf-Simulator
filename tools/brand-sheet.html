<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fairway brand</title>
<style>
  body { margin: 0; font: 14px -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; background: #e9e6dd; color: #10261d; }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 40px; display: grid; gap: 18px; justify-items: start; }
  .dark { background: #06090f; color: #f5f1e8; }
  .light { background: #f7f4ec; }
  .sizes { display: flex; align-items: end; gap: 22px; }
  .sizes figure { margin: 0; display: grid; justify-items: center; gap: 6px; font-size: 11px; opacity: .7; }
  h2 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
  .px16 { width: 16px; height: 16px; image-rendering: auto; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell dark"><h2>On dark</h2><img src="../assets/brand/fairway-logo-dark.svg" width="300" alt="Fairway logo for dark backgrounds" /></div>
    <div class="cell light"><h2>On light</h2><img src="../assets/brand/fairway-logo-light.svg" width="300" alt="Fairway logo for light backgrounds" /></div>
  </div>
  <div class="row">
    <div class="cell dark"><h2>Mark</h2><img src="../assets/brand/fairway-mark.svg" width="96" alt="Fairway mark" /></div>
    <div class="cell light"><h2>App icon and favicon</h2>
      <div class="sizes">
        <figure><img src="../icon.svg" width="180" alt="" /><figcaption>180</figcaption></figure>
        <figure><img src="../icon.svg" width="64" alt="" /><figcaption>64</figcaption></figure>
        <figure><img src="../icon.svg" width="32" alt="" /><figcaption>32</figcaption></figure>
        <figure><img src="../icon.svg" class="px16" alt="" /><figcaption>16</figcaption></figure>
      </div>
    </div>
  </div>
</body>
</html>
